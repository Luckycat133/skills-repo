name: 🐛 Bug Report
description: Report an issue with context migration, conversion, device transfer, or verification
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please check if your problem is already reported in open issues.

        > ⚠️ **Do NOT paste API keys, tokens, cookies, Authorization headers, `.env` values,
        > private repository URLs, full configuration files, or session logs into this issue.**
        > GitHub Issues are **public** and are **not** automatically redacted. Manually replace
        > any sensitive value with a placeholder such as `<REDACTED>` before submitting.
  - type: input
    id: host_agent
    attributes:
      label: Host Agent & Version
      description: Which coding agent loaded `skills/agent-skills-setup/` (or ran `migrate_context.py`)?
      placeholder: "e.g. Claude Code 1.x, Codex CLI, Cursor Agent, Antigravity"
    validations:
      required: true
  - type: input
    id: source_target
    attributes:
      label: Source and Target Profiles
      description: Which profiles and scopes were involved? (See `skills/agent-skills-setup/references/products.md`)
      placeholder: "e.g. cursor -> claude-code (project scope)"
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow / Subcommand
      description: Which workflow or `scripts/migrate_context.py` subcommand produced the issue?
      options:
        - "migrate (cross-tool migration)"
        - "inspect (discovery / inventory)"
        - "export-device (device transfer export)"
        - "import-device (device transfer restore)"
        - "patch-mcp (custom/long-tail MCP patch)"
        - "guided agent edit (Skill reference guidance)"
        - "other"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which platform and execution host are you running on?
      options:
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Linux"
        - "Windows (Native)"
        - "Windows (WSL2)"
        - "Remote SSH / Devcontainer / Cloud"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Minimal redacted reproduction steps and observed output (confirm no credentials or private paths remain).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What semantic mapping, file output, or safety refusal should have occurred instead?
    validations:
      required: false
