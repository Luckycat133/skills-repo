name: 🔍 Report Path Drift / Verify Client Contract
description: Report an outdated, changed, or newly verified configuration path or schema for a cataloged profile
title: "[Path Update]: "
labels: ["ide-profile", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        AI coding tools evolve rapidly. If a client changed its Skills, Rules, MCP, Commands, Agents, or Hooks contract, share the versioned primary evidence here.
  - type: input
    id: product_profile
    attributes:
      label: Profile ID & Installed Version
      description: The profile identifier in `skills/agent-skills-setup/references/products.md` plus version/harness.
      placeholder: "e.g. cursor (0.50 IDE), claude-code (CLI), gemini-cli, amazon-q"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Context Category
      description: Which context category changed?
      options:
        - "skills"
        - "instructions / rules"
        - "mcp"
        - "prompts / commands"
        - "agents / subagents"
        - "hooks / workflows"
        - "plugins / extensions"
        - "authored memory / knowledge"
        - "other"
    validations:
      required: true
  - type: input
    id: old_path
    attributes:
      label: Current Documented Path / Key
      description: What path or schema key is currently described in `references/products/*.md`?
      placeholder: "e.g. ~/.cursor/mcp.json"
    validations:
      required: false
  - type: input
    id: new_path
    attributes:
      label: Verified Path / Schema Contract
      description: What is the verified location or schema on the installed client? (Use logical `$HOME` / `<workspace>`, never private usernames.)
      placeholder: "e.g. .cursor/mcp.json (`mcpServers`)"
    validations:
      required: true
  - type: input
    id: evidence_source
    attributes:
      label: Official Documentation / Release Note URL
      description: Primary vendor URL or local schema reference confirming this contract.
      placeholder: "https://..."
    validations:
      required: true
