name: 🚀 Request New Client / Profile Reference
description: Propose vendor documentation coverage for a new AI coding agent, IDE, or harness profile
title: "[Profile Request]: "
labels: ["enhancement", "ide-profile"]
body:
  - type: markdown
    attributes:
      value: |
        Share primary vendor documentation and versioned context contracts to add or refine a profile in `skills/agent-skills-setup/references/products/`. Third-party installer lists alone are not sufficient evidence of native support.
  - type: input
    id: tool_name
    attributes:
      label: Product / Harness Name & Version
      description: Exact vendor, product name, and CLI/IDE/cloud surface.
      placeholder: "e.g. ExampleCode CLI 1.2"
    validations:
      required: true
  - type: input
    id: official_docs
    attributes:
      label: Official Documentation URL
      description: Primary vendor customization documentation or official repository schema URL.
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: surfaces
    attributes:
      label: Documented Context Surfaces
      description: |
        Where does this client load instructions, Skills, MCP, commands, agents, hooks, or authored memory?
        Include scope (user vs project), precedence, and any activation/security caveats.
    validations:
      required: false
