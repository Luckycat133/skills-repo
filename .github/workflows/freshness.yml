name: Freshness Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      demote_stale:
        description: 'Demote stale profiles in registry'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run freshness check
        id: freshness
        run: |
          python3 skills/agent-skills-setup/scripts/check-doc-freshness.py \
            --registry skills/agent-skills-setup/references/registry-v2.json \
            --checks skills/agent-skills-setup/references/doc-freshness-checks.json \
            --max-age-days 365 \
            --report freshness-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.json

      - name: Check for stale profiles
        if: always()
        run: |
          if [ -f freshness-report.json ]; then
            cat freshness-report.json | jq '.errors[] | select(. | contains("stale"))'
          fi

  stale-demotion:
    needs: freshness-check
    if: always() && (github.event.inputs.demote_stale == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run freshness check with demote-stale
        id: demote
        run: |
          python3 skills/agent-skills-setup/scripts/check-doc-freshness.py \
            --registry skills/agent-skills-setup/references/registry-v2.json \
            --checks skills/agent-skills-setup/references/doc-freshness-checks.json \
            --max-age-days 365 \
            --demote-stale \
            --report demote-report.json

      - name: Check if registry was modified
        id: changes
        run: |
          if git diff --quiet skills/agent-skills-setup/references/registry-v2.json; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
            git diff skills/agent-skills-setup/references/registry-v2.json
          fi

      - name: Create Pull Request for Stale Demotions
        if: steps.changes.outputs.modified == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.github.com"
          BRANCH="chore/demote-stale-profiles-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add skills/agent-skills-setup/references/registry-v2.json
          git commit -m "chore: demote stale profiles"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: demote stale profiles [$(date +%Y-%m-%d)]" \
            --body "Automated freshness check identified stale profiles and demoted them. Please review before merging." \
            --head "$BRANCH" \
            --base main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload demotion report
        uses: actions/upload-artifact@v4
        with:
          name: demote-report
          path: demote-report.json

  candidate-discovery:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'  # Only run on schedule
    steps:
      - name: Check registry online_checks_enabled flag
        id: gate
        run: |
          if python3 -c "import json,sys; r=json.load(open('skills/agent-skills-setup/references/registry-v2.json')); sys.exit(0 if r.get('online_checks_enabled', False) else 1)" ; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "registry online_checks_enabled is false; skipping candidate-discovery"
            exit 0
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate candidate discovery report
        id: candidates
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 << 'EOF'
          import json
          import subprocess
          from datetime import date

          # Known candidate products to check
          candidates = [
              {"name": "Hermes Agent", "url": "https://github.com/hermes-agent/hermes"},
              {"name": "GitLab Duo", "url": "https://docs.gitlab.com/ee/user/duo_agent_platform/"},
              {"name": "Google Jules", "url": "https://jules.google.com/"},
              {"name": "Zencoder", "url": "https://docs.zencoder.ai/"},
              {"name": "Zenflow", "url": "https://docs.zenflow.ai/"},
              {"name": "Letta Code", "url": "https://docs.letta.com/letta-code/"},
              {"name": "Gemini Code Assist", "url": "https://cloud.google.com/gemini-code-assist/docs"},
              {"name": "HuggingFace Agents", "url": "https://huggingface.co/docs/transformers/agents"},
              {"name": "LangChain Agents", "url": "https://python.langchain.com/docs/modules/agents/"},
              {"name": "AutoGPT", "url": "https://github.com/Significant-Gravitas/AutoGPT"},
              {"name": "BabyAGI", "url": "https://github.com/yoheinakajima/babyagi"},
              {"name": "MetaGPT", "url": "https://github.com/geekan/MetaGPT"},
            ]

          # Check if products already exist in registry
          with open('skills/agent-skills-setup/references/registry-v2.json', 'r') as f:
              registry = json.load(f)
          existing_products = set(registry.get('products', {}).keys())

          report = {
              "generated_at": str(date.today()),
              "total_candidates": len(candidates),
              "existing": [],
              "new_candidates": [],
              "suggested_registry_diff": []
          }

          for candidate in candidates:
              name = candidate["name"].lower().replace(" ", "-")
              if name in existing_products:
                  report["existing"].append(candidate["name"])
              else:
                  report["new_candidates"].append(candidate)
                  report["suggested_registry_diff"].append({
                      "action": "add_product",
                      "product": name,
                      "display_name": candidate["name"],
                      "category": "agent-client",
                      "lifecycle": "active",
                      "default_profile": "cli",
                      "sources": [candidate["url"]],
                      "reason": "New AI coding agent discovered"
                  })

          output_path = "candidate-discovery-report.json"
          with open(output_path, 'w') as f:
              json.dump(report, f, indent=2)
          print(f"Candidate discovery report written to {output_path}")
          print(f"Total: {report['total_candidates']}, Existing: {len(report['existing'])}, New: {len(report['new_candidates'])}")
          EOF

      - name: Upload candidate discovery report
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-report
          path: candidate-discovery-report.json

      - name: Create issue for new candidates
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -f candidate-discovery-report.json ]; then
            NEW_COUNT=$(cat candidate-discovery-report.json | jq '.new_candidates | length')
            if [ "$NEW_COUNT" -gt 0 ]; then
              gh issue create \
                --title "New AI Agent Candidates Discovered - $(date +%Y-%m-%d)" \
                --body "$(cat candidate-discovery-report.json | jq -r '.new_candidates | .[] | "- \(.name): \(.url)"')" \
                --label "candidate-discovery" \
                --repo Luckycat133/skills-repo || true
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}