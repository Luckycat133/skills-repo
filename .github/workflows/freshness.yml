name: Offline Freshness Check (Runtime Safe)

# This workflow runs STRICTLY OFFLINE checks suitable for Skill runtime.
# It validates verified_at dates, HTTPS source URLs, and schema consistency.
# It does NOT make any network requests.
#
# For online checks (fetching docs, detecting 404/schema changes), see
# maintainer-online-checks.yml which runs separately with maintainer permissions.

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      demote_stale:
        description: 'Demote stale profiles in registry (creates PR for review)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    outputs:
      stale_found: ${{ steps.evidence.outputs.stale_found }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline freshness check
        id: freshness
        run: |
          python3 skills/agent-skills-setup/scripts/check-doc-freshness.py \
            --registry skills/agent-skills-setup/references/registry-v2.json \
            --checks skills/agent-skills-setup/references/doc-freshness-checks.json \
            --max-age-days 365 \
            --report freshness-report.json

      - name: Export stale evidence
        id: evidence
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("freshness-report.json")
          stale = []
          if path.is_file():
              report = json.loads(path.read_text(encoding="utf-8"))
              stale = report.get("stale_profiles", [])
          found = isinstance(stale, list) and bool(stale) and all(isinstance(item, str) for item in stale)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stale_found={'true' if found else 'false'}\n")
          PY

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.json

      - name: Report stale profiles
        if: always()
        run: |
          if [ -f freshness-report.json ]; then
            cat freshness-report.json | jq '.errors[] | select(. | contains("stale"))'
          fi

  stale-demotion:
    # Only run on manual dispatch with demote_stale=true.
    # Do NOT run on schedule to avoid creating PRs automatically.
    needs: freshness-check
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.demote_stale && needs.freshness-check.outputs.stale_found == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run freshness check with demote-stale
        id: demote
        run: |
          python3 skills/agent-skills-setup/scripts/check-doc-freshness.py \
            --registry skills/agent-skills-setup/references/registry-v2.json \
            --checks skills/agent-skills-setup/references/doc-freshness-checks.json \
            --max-age-days 365 \
            --demote-stale \
            --report demote-report.json

      - name: Check if registry was modified
        id: changes
        run: |
          if git diff --quiet skills/agent-skills-setup/references/registry-v2.json; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
            git diff skills/agent-skills-setup/references/registry-v2.json
          fi

      - name: Create Pull Request for Stale Demotions
        if: steps.changes.outputs.modified == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.github.com"
          BRANCH="chore/demote-stale-profiles-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add skills/agent-skills-setup/references/registry-v2.json
          git commit -m "chore: demote stale profiles"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: demote stale profiles [$(date +%Y-%m-%d)]" \
            --body "Automated freshness check identified stale profiles and demoted them. Please review before merging." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload demotion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demote-report
          path: demote-report.json

  # candidate-discovery is DISABLED in offline mode.
  # Online candidate discovery runs in maintainer-online-checks.yml
  # when registry.online_checks_enabled is true.
