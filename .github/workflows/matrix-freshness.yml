name: Matrix Freshness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regenerate compatibility matrix and diff
        run: |
          python3 skills/agent-skills-setup/scripts/generate-compatibility-matrix.py --check
