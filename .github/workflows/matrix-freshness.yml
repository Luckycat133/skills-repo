name: Matrix Freshness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate compatibility matrix and diff
        run: |
          python3 skills/agent-skills-setup/scripts/generate-compatibility-matrix.py --check
