name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up validation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: >-
          python3 -m pip install
          'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          cryptography==50.0.2 jsonschema==4.26.0
      - name: Validate repository & run full test suites
        if: matrix.os != 'windows-latest'
        run: bash validate-all.sh
      - name: Validate repository & run full test suites (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash validate-all.sh
